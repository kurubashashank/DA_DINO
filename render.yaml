services:
  - type: web
    name: da-dino-clothing-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Vercel and Render use different sites by default. For a same-site
      # custom-domain deployment, change this to "lax" after testing.
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: COOKIE_SECURE
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "10000"
      - key: MONGODB_MAX_POOL_SIZE
        value: "10"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ALLOW_ADMIN_SETUP
        value: "false"
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: ALLOW_ADMIN_SIGNUP
        value: "false"
      - key: ADMIN_SIGNUP_KEY
        sync: false
